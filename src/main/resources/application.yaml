spring:
  application:
    name: ez-kafka
  docker:
    compose:
      file: docker-compose/compose.yaml
  kafka:
    consumer:
      bootstrap-servers: localhost:9092
      group-id: ${random.uuid}
      security:
        protocol: SSL
      ssl:
        bundle: ez-kafka

  ssl:
    bundle:
      jks:
        ez-kafka:
          truststore:
            type: PKCS12
            location: classpath:truststore.p12
            password: changeit
          keystore:
            type: PKCS12
            location: classpath:keystore.p12
            password: changeit